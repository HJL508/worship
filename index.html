<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 구역 송이송이</title>
<meta name="theme-color" content="#7B4FC9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="우리 구역 송이송이">
<meta property="og:description" content="공지와 우리 구역 포도나무를 보러 가요">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#FBF8FF; --card:#FFFFFF; --ink:#2A1F33; --sub:#776C88; --muted:#A79DB8; --line:#EEE7F8;
  --grape:#7B4FC9; --grape-d:#5A3699; --soft:#F1EAFD; --leaf:#6FA343; --night:#232B5C;
  --danger:#C2415D; --ok:#3F8A3A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
a{color:var(--grape-d)}
.jua{font-family:Jua,Pretendard,sans-serif;font-weight:400}
header{padding:18px 0 4px}
.hrow{display:flex;align-items:center;gap:10px}
.hname{font-size:24px;margin:0;flex:1;line-height:1.2}
.iconbtn{width:40px;height:40px;border-radius:50%;border:none;background:var(--soft);color:var(--grape-d);display:flex;align-items:center;justify-content:center}
.iconbtn.on{background:var(--grape);color:#fff}
.verse{background:var(--soft);border-radius:16px;padding:12px 14px;margin:12px 0 4px;font-size:13.5px;line-height:1.7;color:#4E3F69}
.verse b{font-weight:600;color:var(--grape-d)}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 0 var(--line)}
.sec{font-size:15px;font-weight:700;margin:22px 4px 6px;color:var(--sub)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600}
.b-sunday{background:#F1EAFD;color:#4B2E86}.b-friday{background:#E3E7FA;color:#26306A}.b-monthly{background:#E6F4DA;color:#2F5E1A}.b-etc{background:#F0EEF3;color:#5E566B}
.date{font-size:12.5px;color:var(--sub)}
.ntitle{font-size:18px;font-weight:700;margin:8px 0 10px;line-height:1.4}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--grape);border-color:var(--grape);color:#fff}
.btn{border:none;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;background:var(--soft);color:var(--grape-d)}
.btn.primary{background:var(--grape);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--sub)}
.btn.danger{background:#FCEBEF;color:var(--danger)}
.btn:disabled{opacity:.6}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--grape)}
textarea{min-height:160px;line-height:1.6;resize:vertical}
label.l{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:12px 0 6px}
.err{color:var(--danger);font-size:13px;margin:6px 2px 0;min-height:1px}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.info{display:grid;grid-template-columns:auto 1fr;gap:0;margin:12px 0;border-top:1px solid var(--line)}
.info div{padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.info .k{color:var(--grape-d);font-weight:700;padding-right:14px;white-space:nowrap}
.body{font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;margin:10px 0}
.links{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.linkbtn{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;background:var(--soft);color:var(--grape-d);text-decoration:none;font-size:14px;font-weight:600}
.player{margin:10px 0 4px}
.pv{position:relative;border-radius:16px;overflow:hidden;background:#1D1830;aspect-ratio:16/9;touch-action:pan-y}
.pv img{width:100%;height:100%;object-fit:cover;display:block}
.pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.playbtn{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:none;background:rgba(123,79,201,.92);color:#fff;display:flex;align-items:center;justify-content:center}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:var(--grape-d);display:flex;align-items:center;justify-content:center}
.nav.l{left:8px}.nav.r{right:8px}
.pcount{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
.pinfo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 2px}
.pinfo .t{font-weight:700;font-size:14.5px}
.pinfo a{font-size:12px;white-space:nowrap}
.songs{margin:6px 0 0}
.songs .h{font-size:13px;font-weight:700;color:var(--sub);margin:12px 2px 6px}
.song{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;padding:8px 6px;border-radius:12px;font-size:14px;color:var(--ink)}
.song.on{background:var(--soft)}
.song .no{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--grape-d);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.song.on .no{background:var(--grape);color:#fff}
.nhead{display:flex;gap:12px;align-items:center;width:100%;border:none;background:transparent;text-align:left;padding:0;color:var(--ink)}
.thumb{width:76px;height:48px;border-radius:10px;background:#E9E2F6;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--grape)}
.thumb img{width:100%;height:100%;object-fit:cover}
.mblock{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mblock:first-of-type{border-top:none}
.mdate{background:#E6F4DA;color:#2F5E1A;font-weight:700;font-size:13px;border-radius:10px;padding:6px 9px;height:fit-content;white-space:nowrap}
.mitems{font-size:14.5px;line-height:1.7}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:10px 0 0}
.legend span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex-shrink:0}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin:8px 0}
.seg button{flex:1;border:none;background:transparent;border-radius:11px;padding:9px 4px;font-size:14px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--grape-d);box-shadow:0 1px 0 var(--line)}
.scene{border-radius:18px;overflow:hidden;line-height:0}
.big{font-size:22px;font-weight:800;color:var(--grape-d)}
.center{text-align:center}
.hello{font-size:15px;margin:6px 2px}
.privacy{font-size:12px;color:var(--muted);line-height:1.6;text-align:center;margin:26px 8px 8px}
.row{display:flex;align-items:center;gap:8px}
.mrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:none}
.mname{flex:1;font-weight:600;font-size:15px}
.tbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tbtn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:5px}
.att-row{padding:12px 0;border-top:1px solid var(--line)}
.att-row:first-child{border-top:none}
.sticky{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:5;padding-top:8px}
#tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#tabs .in{max-width:520px;margin:0 auto;display:flex}
#tabs button{flex:1;border:none;background:transparent;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
#tabs button.on{color:var(--grape)}
#modal{position:fixed;inset:0;background:rgba(42,31,51,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:360px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 0;color:var(--sub)}
.bob{transform-box:fill-box;transform-origin:50% 85%;animation:dori 2.4s ease-in-out infinite}
.zz{transform-box:fill-box;transform-origin:50% 85%;animation:zz 4s ease-in-out infinite}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .6s ease-out both}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes dori{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes zz{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 24s linear infinite}
.fall{animation:fall linear infinite}
.fspin{transform-box:fill-box;transform-origin:50% 50%;animation:fspin 3s ease-in-out infinite}
.flut{animation:flut 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{from{transform:translate(0,-30px)}to{transform:translate(18px,330px)}}
@keyframes fspin{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(40deg)}}
@keyframes flut{0%,100%{transform:translate(0,0)}25%{transform:translate(14px,-10px)}50%{transform:translate(26px,2px)}75%{transform:translate(10px,8px)}}
.award img{width:100%;border-radius:16px;display:block}
.cn{position:relative;border-radius:16px;overflow:hidden;background:#F3EEE6;aspect-ratio:1/1;margin:4px 0 6px;touch-action:pan-y}
.cn img{width:100%;height:100%;object-fit:contain;display:block}
.cn .nav{background:rgba(255,255,255,.92)}
.cn img{cursor:zoom-in}
.cnhint{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px;pointer-events:none;display:flex;align-items:center;gap:4px}
#lb{position:fixed;inset:0;background:#0E0A16;z-index:80;display:none;flex-direction:column}
#lb.show{display:flex}
#lb .top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;color:#fff;font-size:14px}
#lb .x{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center}
#lb .stage{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;cursor:zoom-in;user-select:none;-webkit-user-select:none}
#lb .stage.zoom{display:block}
#lb .stage.zoom img{max-width:none;max-height:none;width:240%;cursor:zoom-out}
#lb .nav{position:fixed;top:50%;transform:translateY(-50%);z-index:2}
#lb .tip{color:rgba(255,255,255,.7);font-size:12px;text-align:center;padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
.cndots{display:flex;justify-content:center;gap:6px;margin:4px 0 10px}
.cndots i{width:7px;height:7px;border-radius:50%;background:#DDD3EE;display:block}
.cndots i.on{background:var(--grape);width:18px;border-radius:4px}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.imgs .it{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:#F3EEE6}
.imgs .it img{width:100%;height:100%;object-fit:cover}
.imgs .it .no{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:8px;padding:1px 6px}
.imgs .it .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(0,0,0,.45)}
.imgs .it .ctl button{border:none;background:transparent;color:#fff;padding:3px 6px;font-size:13px}
@media (prefers-reduced-motion:reduce){.bob,.zz,.pop,.tw,.sway,.spin,.fall,.fspin,.flut{animation:none}}
</style>
</head>

</div>

<script>
/* =========================================================
   우리 구역 송이송이 - 화면 코드 (index.html)
   ========================================================= */

/* ▼▼▼ 구역장님 설정: 앱스스크립트 웹 앱 URL(/exec로 끝나는 주소)을 따옴표 안에 붙여넣으세요 ▼▼▼ */
var API_URL = 'https://script.google.com/macros/s/AKfycbxwMrpInDP2Zrd4_idmgV2zO5_XWr-m3brM3TfDv7MWwbURU664_dgS54LXgYr48wPi/exec';
/* ▲▲▲ 비워두면 예시 데이터로 미리보기만 돼요 ▲▲▲ */

var APP = {
  name: '우리 구역 송이송이',
  verse: '나는 포도나무요 너희는 가지니 저가 내 안에, 내가 저 안에 있으면 이 사람은 과실을 많이 맺나니 나를 떠나서는 너희가 아무 것도 할 수 없음이라',
  verseRef: '요한복음 15:5'
};

var COLOR = { main:'#7B4FC9', five_site:'#D2558F', five_online:'#B9A2E8', cell:'#DCEB6A', fri_site:'#86B032', fri_online:'#E6EDA6', sun_absent:'#8A8494', fri_absent:'#8A8494' };
var TLABEL = { main:'대예배', five_site:'5부 현장', five_online:'5부 온라인', cell:'구역모임', fri_site:'금요철야 현장', fri_online:'금요철야 온라인', sun_absent:'불참', fri_absent:'불참' };
var SUNDAY_TYPES = ['main','five_site','five_online','cell'];
var FRIDAY_TYPES = ['fri_site','fri_online'];
var ABSENT_OF = { sunday:'sun_absent', friday:'fri_absent' };
function isAbsent(t){ return t==='sun_absent'||t==='fri_absent'; }
var ONLINE = { five_online:1, fri_online:1 };
var NMETA = { sunday:['주일','b-sunday'], friday:['금요철야','b-friday'], monthly:['월 일정','b-monthly'], etc:['기타','b-etc'] };
var DAYS = ['일','월','화','수','목','금','토'];
var INK = '#2A1F33';

var state = {
  pub: null, tab: 'home', nfilter: 'all', open: {}, treeBoard: 'sunday', mineBoard: 'sunday',
  admin: null, adminData: null, asub: 'att', att: null, ed: { text:'', parts:[], editId:null, images:[], upl:0, uplTotal:0 },
  my: { token:null, data:null, mode:'login' }
};
var players = {};
var carousels = {};
var parseCache = {};

/* ---------- 작은 도우미 ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var URL_RE = /https?:\/\/[^\s<>"']+/g;
function linkify(s){ return esc(s).replace(/https?:\/\/[^\s<>"']+/g,function(u){ return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'; }); }
function pad(n){ return ('0'+n).slice(-2); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYmd(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function todayStr(){ return ymd(new Date()); }
function fmtDate(s){ if(!s) return ''; var d=parseYmd(s); if(isNaN(d)) return s; return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DAYS[d.getDay()]+')'; }
function lastWeekday(wd, fromStr){ var d=fromStr?parseYmd(fromStr):new Date(); while(d.getDay()!==wd) d.setDate(d.getDate()-1); return ymd(d); }
function nearestWeekday(wd){ var d=new Date(), best=null, bd=99; for(var k=-3;k<=3;k++){ var x=new Date(d); x.setDate(d.getDate()+k); if(x.getDay()===wd && Math.abs(k)<bd){ bd=Math.abs(k); best=x; } } return ymd(best||d); }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
function sstore(k,v){ try{ if(v===undefined) return sessionStorage.getItem(k); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }catch(e){ return null; } }
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },2200); }

/* ---------- 서버 호출 ---------- */
function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(resolve,reject){
    if (typeof google !== 'undefined' && google.script && google.script.run){
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){ reject(new Error((e && e.message) || String(e))); });
      r[fn].apply(r,args);
    } else if (API_URL) {
      fetch(API_URL, { method:'POST', redirect:'follow', credentials:'omit', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ fn:fn, args:args }) })
        .then(function(res){ return res.json(); })
        .then(function(j){ if (j && j.ok) resolve(j.data); else reject(new Error((j && j.error) || '서버 응답을 읽지 못했어요.')); })
        .catch(function(){ reject(new Error('인터넷 연결을 확인해주세요.')); });
    } else {
      setTimeout(function(){ try{ resolve(MOCK[fn].apply(null,args)); }catch(e){ reject(e); } },150);
    }
  });
}

/* =========================================================
   카톡 공지 자동 정리
   ========================================================= */
var YT_RE = /(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|live\/|shorts\/|embed\/))([A-Za-z0-9_-]{11})/;
function ytId(u){ var m=String(u).match(YT_RE); return m?m[1]:null; }
function cleanTitle(s){
  var t = String(s||'');
  try { t = t.replace(/[\p{Extended_Pictographic}\u2B50\u2B55\uFE0F\u200D\u20E3]/gu,''); } catch(e) {}
  return t.replace(/^[\s*\-•·~:|]+|[\s*\-•·~:|]+$/g,'').replace(/\s{2,}/g,' ').trim();
}
function splitParts(text){
  return String(text||'').replace(/\r/g,'').split(/\n[ \t]*[-=_~]{5,}[^\n]*(?=\n|$)/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length>0; });
}
function detectType(raw){
  if (/금요\s*철야/.test(raw)) return 'friday';
  var dateHeads = (raw.match(/^\s*\d{1,2}\s*\/\s*\d{1,2}\s*\(/gm)||[]).length;
  if (/\d{1,2}\s*월\s*(일정|계획)/.test(raw) || dateHeads>=2) return 'monthly';
  if (/주일/.test(raw)) return 'sunday';
  return 'etc';
}
function inferYear(m,d){
  var now=new Date(), best=null, bd=Infinity;
  [now.getFullYear()-1, now.getFullYear(), now.getFullYear()+1].forEach(function(y){
    var x=new Date(y,m-1,d), df=Math.abs(x-now); if(df<bd){ bd=df; best=x; }
  });
  return ymd(best);
}
function detectDate(raw,type){
  var text = String(raw).replace(URL_RE,' ');
  if (type==='monthly'){ var mm=text.match(/(\d{1,2})\s*월/); if(mm && +mm[1]>=1 && +mm[1]<=12) return inferYear(+mm[1],1); }
  var a=text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/), b=text.match(/(^|[^\d])(\d{1,2})\s*\/\s*(\d{1,2})(?!\d)/);
  var cand=[];
  if(a) cand.push({i:a.index,m:+a[1],d:+a[2]});
  if(b) cand.push({i:b.index,m:+b[2],d:+b[3]});
  cand = cand.filter(function(c){ return c.m>=1&&c.m<=12&&c.d>=1&&c.d<=31; }).sort(function(x,y){ return x.i-y.i; });
  if (cand.length) return inferYear(cand[0].m,cand[0].d);
  if (type==='friday') return nearestWeekday(5);
  if (type==='sunday') return nearestWeekday(0);
  return todayStr();
}
function firstTitle(raw){ var l=String(raw).split('\n').filter(function(x){ return x.trim(); })[0]||''; return cleanTitle(l)||'공지'; }

function parseNotice(raw){
  if (parseCache[raw]) return parseCache[raw];
  var lines = String(raw||'').replace(/\r/g,'').split('\n');
  var ti=-1; for(var q=0;q<lines.length;q++){ if(lines[q].trim()){ ti=q; break; } }
  var res = { title: ti>=0?cleanTitle(lines[ti]):'', info:[], songs:[], videos:[], links:[], body:[], songsTitle:'' };
  var isSong = function(t){ return /^\s*\d{1,2}\s*[.)]\s*\S/.test(t); };
  var nextNon = function(j){ for(var k=j;k<lines.length;k++){ if(lines[k].trim()) return k; } return -1; };
  for (var i=ti+1; i<lines.length; i++){
    var L=lines[i], t=L.trim();
    if (!t){ res.body.push(''); continue; }
    if (/^[-=_~]{4,}$/.test(t)) continue;
    if (t.indexOf('📍')===0){
      var s=t.replace(/^📍\s*/,''), m=s.match(/^([^:：]{1,12})[:：]\s*(.*)$/);
      res.info.push(m?[m[1].trim(),m[2].trim()]:['',s]); continue;
    }
    if (isSong(t)){
      var urls=t.match(URL_RE)||[], name=t.replace(URL_RE,'').replace(/^\s*\d{1,2}\s*[.)]\s*/,'').trim(), url=urls[0];
      if(!url){ var k=nextNon(i+1); if(k>0 && /^https?:\/\/\S+$/.test(lines[k].trim())){ url=lines[k].trim(); i=k; } }
      var id = url?ytId(url):null;
      if (id){ res.songs.push({id:id,title:name||('찬양 '+(res.songs.length+1)),url:url}); continue; }
      if (url){ res.links.push({label:name,url:url}); continue; }
      res.body.push(L); continue;
    }
    var found = t.match(URL_RE);
    if (found){
      var label = cleanTitle(t.replace(URL_RE,''));
      if (!label){
        for (var b=res.body.length-1;b>=0;b--){ if(res.body[b].trim()){ if(res.body[b].trim().length<=30){ label=cleanTitle(res.body[b]); res.body.splice(b,1); } break; } }
      }
      found.forEach(function(u){ var vid=ytId(u); if(vid) res.videos.push({id:vid,title:label||'영상',url:u}); else res.links.push({label:label||'링크 열기',url:u}); });
      continue;
    }
    var nk=nextNon(i+1);
    if (nk>0 && isSong(lines[nk].trim()) && !res.songs.length && !res.songsTitle){ res.songsTitle=cleanTitle(t); continue; }
    res.body.push(L);
  }
  var body=[]; res.body.forEach(function(l){ if(!l.trim()){ if(body.length && body[body.length-1]!=='') body.push(''); } else body.push(l.replace(/\s+$/,'')); });
  while(body.length && body[body.length-1]==='') body.pop();
  res.body=body;
  parseCache[raw]=res;
  return res;
}

/* 월 일정: 구역원에게는 '예배 후' 내용만 (서버와 같은 규칙, 관리자 미리보기용) */
function filterMonthly(raw){
  var lines=String(raw||'').replace(/\r/g,'').split('\n'), DATE_RE=/^\s*\d{1,2}\s*\/\s*\d{1,2}/;
  var out=[], blocks=[], cur=null, titleDone=false;
  lines.forEach(function(ln){
    if (DATE_RE.test(ln)){ cur={head:ln.trim(),lines:[]}; blocks.push(cur); return; }
    if (!cur){ if(!titleDone && ln.trim()){ out.push(ln.trim()); titleDone=true; } return; }
    cur.lines.push(ln);
  });
  blocks.forEach(function(b){
    var hasMark=b.lines.some(function(l){ return /^\s*\*/.test(l); }), keep=[];
    if (!hasMark){ b.lines.forEach(function(l){ if(l.trim() && !/참석자/.test(l)) keep.push(l.trim()); }); }
    else { var on=false; b.lines.forEach(function(l){
      if (/^\s*\*/.test(l)){ on=/예배\s*후/.test(l); if(on){ var rest=l.replace(/^\s*\*[^:：]*[:：]?/,'').trim(); if(rest) keep.push(rest); } }
      else if (on && l.trim() && !/참석자/.test(l)) keep.push(l.trim());
    }); }
    if (keep.length){ out.push(''); out.push(b.head); keep.forEach(function(k){ out.push(k); }); }
  });
  return out.join('\n');
}
function parseMonthly(text){
  var lines=String(text||'').split('\n'), DATE_RE=/^\s*\d{1,2}\s*\/\s*\d{1,2}/, title='', blocks=[], cur=null;
  lines.forEach(function(l){
    var t=l.trim(); if(!t) return;
    if (DATE_RE.test(t)){ cur={head:t,items:[]}; blocks.push(cur); return; }
    if (!cur){ if(!title) title=cleanTitle(t); return; }
    cur.items.push(t.replace(/^[-•·]\s*/,''));
  });
  return {title:title, blocks:blocks};
}

function imgUrl(id,w){ if(/^data:/.test(id)) return id; return 'https://lh3.googleusercontent.com/d/'+id+'=w'+(w||1080); }
function imgFallback(el){ var id=el.getAttribute('data-id'); if(!id||el.dataset.fb) return; el.dataset.fb='1'; el.src='https://drive.google.com/thumbnail?id='+id+'&sz=w1080'; }
function cnBox(cid){
  var C=carousels[cid]; if(!C) return '';
  var n=C.ids.length, h='<div class="cn" data-cswipe="'+cid+'">';
  h+='<img src="'+imgUrl(C.ids[C.i])+'" data-id="'+esc(C.ids[C.i])+'" data-act="cn-open" data-cid="'+cid+'" alt="카드뉴스 '+(C.i+1)+'" onerror="imgFallback(this)">'+
     '<span class="cnhint"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M11 8v6M8 11h6"/></svg>눌러서 크게 보기</span>';
  if (n>1){
    h+='<button class="nav l" data-act="cn-prev" data-cid="'+cid+'" aria-label="이전 사진">'+icon('left',20)+'</button>'+
       '<button class="nav r" data-act="cn-next" data-cid="'+cid+'" aria-label="다음 사진">'+icon('right',20)+'</button>'+
       '<span class="pcount">'+(C.i+1)+' / '+n+'</span>';
  }
  h+='</div>';
  if (n>1) h+='<div class="cndots">'+C.ids.map(function(x,i){ return '<i class="'+(i===C.i?'on':'')+'"></i>'; }).join('')+'</div>';
  if (C.ids[C.i+1]) h+='<link rel="prefetch" href="'+imgUrl(C.ids[C.i+1])+'">';
  return h;
}
var LB=null;
function lbRender(){
  var el=$('#lb'); if(!LB){ el.classList.remove('show'); el.innerHTML=''; document.body.style.overflow=''; return; }
  var C=carousels[LB.cid], n=C.ids.length, id=C.ids[C.i];
  el.innerHTML='<div class="top"><span>'+(C.i+1)+' / '+n+'</span><button class="x" data-act="lb-close" aria-label="닫기">'+icon('x',22)+'</button></div>'+
    '<div class="stage'+(LB.zoom?' zoom':'')+'" id="lb-stage"><img src="'+imgUrl(id,2000)+'" data-id="'+esc(id)+'" data-act="lb-zoom" alt="카드뉴스 '+(C.i+1)+'" onerror="imgFallback(this)"></div>'+
    (n>1&&!LB.zoom?'<button class="nav l" data-act="lb-prev" aria-label="이전 사진">'+icon('left',22)+'</button><button class="nav r" data-act="lb-next" aria-label="다음 사진">'+icon('right',22)+'</button>':'')+
    '<div class="tip">'+(LB.zoom?'손가락으로 움직여 보세요 · 사진을 누르면 원래 크기':'사진을 누르면 더 크게 · 옆으로 밀면 다음 사진')+'</div>';
  el.classList.add('show'); document.body.style.overflow='hidden';
}
function lbOpen(cid){ LB={cid:cid,zoom:false}; try{ history.pushState({lb:1},''); }catch(e){} lbRender(); }
function lbClose(fromPop){ if(!LB) return; var cid=LB.cid; LB=null; lbRender(); refreshCn(cid); if(!fromPop){ try{ if(history.state&&history.state.lb) history.back(); }catch(e){} } }
function lbMove(d){ if(!LB) return; var C=carousels[LB.cid]; C.i=(C.i+d+C.ids.length)%C.ids.length; LB.zoom=false; lbRender(); }
window.addEventListener('popstate',function(){ if(LB) lbClose(true); });
document.addEventListener('keydown',function(ev){ if(!LB) return; if(ev.key==='Escape') lbClose(); if(ev.key==='ArrowRight') lbMove(1); if(ev.key==='ArrowLeft') lbMove(-1); });
function refreshCn(cid){ document.querySelectorAll('[data-cn="'+cid+'"]').forEach(function(el){ el.innerHTML=cnBox(cid); }); }
function moveCn(cid,d){ var C=carousels[cid]; if(!C) return; C.i=(C.i+d+C.ids.length)%C.ids.length; refreshCn(cid); }

function noticeCard(n,pid,opt){
  opt=opt||{};
  if (n.type==='monthly') return monthlyCard(n,opt);
  var p=parseNotice(n.raw), items=playerItems(p);
  if (items.length){
    if(!players[pid] || players[pid].sig!==n.raw) players[pid]={items:items,i:0,play:false,sig:n.raw,listTitle:p.songsTitle||(p.songs.length?'찬양 '+p.songs.length+'곡':'')};
  }
  var m=NMETA[n.type]||NMETA.etc, h='';
  h+='<div class="row"><span class="badge '+m[1]+'">'+m[0]+'</span><span class="date">'+fmtDate(n.date)+'</span>'+(n.pinned?'<span class="date" style="margin-left:auto;color:var(--grape)">'+icon('pin',14)+' 고정</span>':'')+'</div>';
  h+='<div class="ntitle">'+esc(n.title||p.title)+'</div>';
  var imgs=n.images||[], playerHTML=items.length?'<div class="player" data-player="'+pid+'">'+playerBox(pid)+'</div>':'';
  var infoHTML=p.info.length?'<div class="info">'+p.info.map(function(kv){ return '<div class="k">'+esc(kv[0])+'</div><div>'+linkify(kv[1])+'</div>'; }).join('')+'</div>':'';
  var bodyHTML=p.body.length?'<div class="body">'+linkify(p.body.join('\n'))+'</div>':'';
  if (imgs.length){
    var sigI=imgs.join(',');
    if(!carousels[pid] || carousels[pid].sig!==sigI) carousels[pid]={ids:imgs.slice(),i:0,sig:sigI};
    h+='<div data-cn="'+pid+'">'+cnBox(pid)+'</div>';
  }
  var main=[], tail=[];   // '유튜브' 안내 줄은 찬양 아래로 보내요
  p.body.forEach(function(l){ (/유튜브|youtube/i.test(l)?tail:main).push(l); });
  while(main.length && !main[main.length-1].trim()) main.pop();
  bodyHTML=main.length?'<div class="body">'+linkify(main.join('\n'))+'</div>':'';
  var tailHTML=tail.length?'<div class="body">'+linkify(tail.join('\n'))+'</div>':'';
  h+=infoHTML+bodyHTML+playerHTML+tailHTML;   // (카드뉴스) → 정보 → 한마디 → 찬양 → 유튜브 안내
  if (p.links.length){ h+='<div class="links">'+p.links.map(function(l){ return '<a class="linkbtn" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+icon('link',18)+'<span>'+esc(l.label)+'</span><span style="margin-left:auto">'+icon('ext',16)+'</span></a>'; }).join('')+'</div>'; }
  return opt.bare?h:'<div class="card">'+h+'</div>';
}
function monthlyCard(n,opt){
  opt=opt||{};
  var mp=parseMonthly(n.raw), h='';
  h+='<div class="row"><span class="badge b-monthly">월 일정</span><span class="date">'+(n.date?(parseYmd(n.date).getMonth()+1)+'월':'')+'</span></div>';
  h+='<div class="ntitle">'+esc(n.title||mp.title||'이번 달 일정')+'</div>';
  if (!mp.blocks.length) h+='<p class="muted">구역원에게 보여줄 일정이 없어요.</p>';
  mp.blocks.forEach(function(b){ h+='<div class="mblock"><span class="mdate">'+esc(b.head)+'</span><div class="mitems">'+b.items.map(function(x){ return linkify(x); }).join('<br>')+'</div></div>'; });
  return opt.bare?h:'<div class="card">'+h+'</div>';
}
function noticeHead(n){
  var m=NMETA[n.type]||NMETA.etc, p=n.type==='monthly'?null:parseNotice(n.raw), it=p?playerItems(p)[0]:null, im=(n.images||[])[0];
  return '<button class="nhead" data-act="ntoggle" data-id="'+esc(n.id)+'"><span class="thumb">'+(im?'<img src="'+imgUrl(im,200)+'" data-id="'+esc(im)+'" alt="" loading="lazy" onerror="imgFallback(this)">':it?'<img src="https://i.ytimg.com/vi/'+it.id+'/mqdefault.jpg" alt="" loading="lazy">':icon(n.type==='monthly'?'bell':'bell',22))+'</span>'+
    '<span style="flex:1;min-width:0"><span class="row" style="gap:6px"><span class="badge '+m[1]+'">'+m[0]+'</span><span class="date">'+fmtDate(n.date)+'</span></span>'+
    '<span style="display:block;font-weight:700;font-size:15px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(n.title)+'</span></span>'+
    '<span style="color:var(--muted)">'+icon('down',18)+'</span></button>';
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]'); if(!el) return;
  var act=el.dataset.act, id=el.dataset.id;
  if (act==='tab'){ state.tab=el.dataset.tab; render(); window.scrollTo(0,0); if(state.tab==='admin'&&state.admin&&!state.adminData) loadAdmin(); return; }

    if (LB.zoom){ LB.zoom=false; lbRender(); return; }
    var r=el.getBoundingClientRect(), fx=(ev.clientX-r.left)/r.width, fy=(ev.clientY-r.top)/r.height;
    LB.zoom=true; lbRender();
    var st=$('#lb-stage'), im=st.querySelector('img');
    var go=function(){ st.scrollLeft=Math.max(0,im.offsetWidth*fx-st.clientWidth/2); st.scrollTop=Math.max(0,im.offsetHeight*fy-st.clientHeight/2); };
    if (im.complete) go(); else im.onload=go;
    return;
  }
  if (act==='cn-prev'){ moveCn(el.dataset.cid,-1); return; }
  if (act==='cn-next'){ moveCn(el.dataset.cid,1); return; }

  if (act==='img-left'||act==='img-right'){ var L2=state.ed.images, i2=+el.dataset.i, j2=i2+(act==='img-left'?-1:1); if(j2>=0&&j2<L2.length){ var tt=L2[i2]; L2[i2]=L2[j2]; L2[j2]=tt; } render(); return; }
  if (act==='prev'){ movePlayer(el.dataset.pid,-1); return; }
  if (act==='next'){ movePlayer(el.dataset.pid,1); return; }
  if (act==='pick'){ var Q=players[el.dataset.pid]; if(Q){ Q.i=+el.dataset.i; Q.play=true; refreshPlayer(el.dataset.pid); } return; }

      .catch(function(e){ busy(el,false); $('#adm-err').textContent=e.message; });
    return;
  }
  if (act==='admin-out'){ call('adminLogout',state.admin); state.admin=null; state.adminData=null; state.att=null; sstore('adm',null); state.tab='home'; render(); return; }
  if (act==='asub'){ state.asub=el.dataset.s; render(); if(state.asub==='award') loadAward(); return; }

/* 카드뉴스 사진: 줄여서(긴 변 1280px) 한 장씩 올려요 */
function shrinkImage(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=1280, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
      var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg',0.86));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요')); };
    img.src=url;
  });
}
function addImages(files){
  files=Array.prototype.filter.call(files||[],function(f){ return /^image\//.test(f.type); }).slice(0,15);
  if (!files.length) return;
  var ed=state.ed; ed.upl=files.length; ed.uplTotal=files.length; render();
  var chain=Promise.resolve();
  files.forEach(function(f){
    chain=chain.then(function(){ return shrinkImage(f); }).then(function(d){ return call('uploadImage',state.admin,d,f.name); })
      .then(function(id){ ed.images.push(id); }).catch(function(e){ toast(e.message||'사진을 올리지 못했어요'); })
      .then(function(){ ed.upl--; var y=window.scrollY; render(); window.scrollTo(0,y); });
  });
  chain.then(function(){ toast('사진을 올렸어요'); });
}

document.addEventListener('paste',function(ev){

  var fs=[]; Array.prototype.forEach.call(ev.clipboardData.items||[],function(it){ if(it.kind==='file' && /^image\//.test(it.type)){ var f=it.getAsFile(); if(f) fs.push(f); } });
  if (fs.length) addImages(fs);
});
